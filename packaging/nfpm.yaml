---
# nfpm config for building the certmanager RPM.
# Rendered through envsubst (see scripts/build-rpm.sh) then fed to `nfpm pkg`.

name: ${PACKAGE_NAME}
version: ${PACKAGE_VERSION}
release: ${PACKAGE_RELEASE}
arch: ${PACKAGE_ARCH}
platform: ${PACKAGE_PLATFORM}
section: default
priority: extra
description: "${PACKAGE_DESCRIPTION}"

maintainer: ${PACKAGE_MAINTAINER}
homepage: ${PACKAGE_HOMEPAGE}
license: ${PACKAGE_LICENSE}

disable_globbing: false

replaces:
  - certmanager
provides:
  - certmanager

contents:
  - src: dist/certmanager
    dst: /usr/bin/certmanager
    file_info:
      mode: 0755
      owner: root
      group: root

  # Puppet's profiles::pki::vault calls the binary at this hardcoded path.
  - src: /usr/bin/certmanager
    dst: /usr/local/bin/certmanager
    type: symlink

  # Shell completions (generated by scripts/build-rpm.sh before packaging).
  - src: dist/completions/certmanager.bash
    dst: /usr/share/bash-completion/completions/certmanager
    file_info:
      mode: 0644
  - src: dist/completions/_certmanager
    dst: /usr/share/zsh/site-functions/_certmanager
    file_info:
      mode: 0644
  - src: dist/completions/certmanager.fish
    dst: /usr/share/fish/vendor_completions.d/certmanager.fish
    file_info:
      mode: 0644
